<script>
const getRepos = function(id) {
    return new Promise((resolve, reject) => {
        try {
            setTimeout(() => {
                resolve({id})
            }, 2000)
        } catch(err) {
            reject(err)
        }
    })
};

 (async() => {
    const allPromise = [getRepos('pose203'), getRepos('miao-key')]
    Promise.all(allPromise).then(data => {
        console.log(data)
    })
