<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手写promise.all</title>
</head>
<body>
  <script>
    // Promise 状态有3个pengding,fulfilled,rejected
    //penging -> fulfilled 成功-> reject失败
    Promise.MyAll = function (promises) {
        let arr = [];//结果数组
        let count = 0;//计数器
        return new Promise((resolve, reject) => {
            //resolve ->all promise 所有都resolve才能调用
            // 如果promise[i]不是promise怎么办?Promise.resolve(promise[i])
            promises.forEach((item, i) => {
               Promise.resolve(item).then(res => {
                arr[i] = res;
                count++;
                if (count === promises.length) resolve(arr);
               }).catch(reject);
            })

        })
    }
  </script>
</body>
</html>
